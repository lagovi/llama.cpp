name: Termux Build (Vulkan)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.1.1
        with:
          version: 1.3.275.0
          macOS: false

      - name: Locate glslc and Export
        run: |
          # Находим glslc в системе и сохраняем путь
          GLSLC_PATH=$(which glslc)
          echo "glslc found exactly at: $GLSLC_PATH"
          echo "GLSLC_PATH=$GLSLC_PATH" >> $GITHUB_ENV

      - name: Build llama.cpp for Android
        run: |
          mkdir build && cd build
          
          # Пробиваем песочницу NDK: явно указываем Vulkan_GLSLC_EXECUTABLE
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_VULKAN_EMBED_SHADERS=ON \
            -DVulkan_GLSLC_EXECUTABLE=$GLSLC_PATH \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF

          # nproc использует все ядра сервера
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-binaries-vulkan
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
