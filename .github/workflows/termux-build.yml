name: Termux Build (OpenCL-CLBlast)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CLBlast and OpenCL Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libclblast-dev opencl-headers ocl-icd-opencl-dev

      - name: Build llama.cpp for Android
        run: |
          mkdir build && cd build
          
          # Используем GGML_CLBLAST вместо GGML_VULKAN
          # Это обеспечит совместимость с OpenCL 2.0 на вашей Mali
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CLBLAST=ON \
            -DGGML_VULKAN=OFF \
            -DGGML_OPENCL=OFF \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF

          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-clblast-final
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
            build/bin/*.so*
