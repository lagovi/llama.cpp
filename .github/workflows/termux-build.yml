name: Termux Build (Vulkan & OpenCL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build llama.cpp for Android
        run: |
          mkdir build && cd build
          
          # На виртуальных машинах GitHub NDK обычно лежит в этой папке
          # Используем системный NDK напрямую
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_OPENCL=ON \
            -DGGML_VULKAN_EMBED_SHADERS=ON \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF

          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-binaries-android
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
