name: Termux Build (Real-CLBlast)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare OpenCL for Android NDK
        run: |
          # 1. Скачиваем официальные заголовки
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git opencl-inc
          
          # 2. Генерируем "Полную заглушку" OpenCL со всеми стандартными функциями
          cat <<EOF > opencl_stub.c
          #include <CL/cl.h>
          #define STUB(name) int name() { return 0; }
          STUB(clGetPlatformIDs) STUB(clGetPlatformInfo) STUB(clGetDeviceIDs) STUB(clGetDeviceInfo)
          STUB(clCreateContext) STUB(clReleaseContext) STUB(clCreateCommandQueue) STUB(clReleaseCommandQueue)
          STUB(clCreateBuffer) STUB(clReleaseMemObject) STUB(clGetMemObjectInfo) STUB(clCreateProgramWithSource)
          STUB(clCreateProgramWithBinary) STUB(clReleaseProgram) STUB(clBuildProgram) STUB(clGetProgramBuildInfo)
          STUB(clCreateKernel) STUB(clReleaseKernel) STUB(clSetKernelArg) STUB(clEnqueueNDRangeKernel)
          STUB(clWaitForEvents) STUB(clReleaseEvent) STUB(clFinish) STUB(clFlush) STUB(clGetEventProfilingInfo)
          STUB(clGetProgramInfo) STUB(clGetKernelWorkGroupInfo) STUB(clEnqueueReadBuffer) STUB(clEnqueueWriteBuffer)
          STUB(clCreateSampler) STUB(clReleaseSampler) STUB(clEnqueueCopyBuffer) STUB(clCreateImage)
          EOF
          
          # Компилируем заглушку под ARM64
          NDK_CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          $NDK_CLANG -shared -fPIC -o libOpenCL.so opencl_stub.c
          
          echo "OPENCL_INC_DIR=$(pwd)/opencl-inc" >> $GITHUB_ENV
          echo "OPENCL_STUB_LIB=$(pwd)/libOpenCL.so" >> $GITHUB_ENV

      - name: Build CLBlast for Android
        run: |
          git clone --depth 1 https://github.com/CNugteren/CLBlast.git
          cd CLBlast && mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENCL_INCLUDE_DIRS=$OPENCL_INC_DIR \
            -DOPENCL_LIBRARIES=$OPENCL_STUB_LIB
          make -j$(nproc)
          
          echo "CLBLAST_DIR=$(pwd)" >> $GITHUB_ENV
          echo "CLBLAST_INC=$(pwd)/../include" >> $GITHUB_ENV

      - name: Build llama.cpp with CLBlast
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CLBLAST=ON \
            -DCLBlast_INCLUDE_DIR=$CLBLAST_INC \
            -DCLBlast_LIB=$CLBLAST_DIR/libclblast.so \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF

          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-clblast-real
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
            build/bin/*.so*
            CLBlast/build/libclblast.so*
