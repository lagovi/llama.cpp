name: Termux Build (Vulkan)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Build llama.cpp for Android
        run: |
          mkdir build && cd build
          
          # CMAKE_FIND_ROOT_PATH_MODE_PROGRAM=BOTH - магический флаг, разрешающий брать glslc из системы
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_VULKAN_EMBED_SHADERS=ON \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=BOTH \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF

          # Используем все ядра сервера (собирается за 2-3 минуты)
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-binaries-vulkan
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
