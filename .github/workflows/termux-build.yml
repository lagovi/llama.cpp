name: Termux Build (Modern llama.cpp + CLBlast)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Подготовка OpenCL Stub (Ваш старый добрый хак)
      - name: Prepare OpenCL Stub
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git opencl-inc
          grep -hoP '\bcl[A-Z][a-zA-Z0-9_]+\b' opencl-inc/CL/*.h | sort -u | awk '{print "void "$1"() {}"}' > opencl_stub.c
          NDK_CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          $NDK_CLANG -shared -fPIC -o libOpenCL.so opencl_stub.c
          echo "OPENCL_INC_DIR=$(pwd)/opencl-inc" >> $GITHUB_ENV
          echo "OPENCL_STUB_LIB=$(pwd)/libOpenCL.so" >> $GITHUB_ENV

      # 2. Сборка CLBlast под Android
      - name: Build CLBlast
        run: |
          git clone --depth 1 https://github.com/CNugteren/CLBlast.git
          cd CLBlast && mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENCL_INCLUDE_DIRS=$OPENCL_INC_DIR \
            -DOPENCL_LIBRARIES=$OPENCL_STUB_LIB
          make -j$(nproc)
          echo "CLBLAST_DIR=$(pwd)" >> $GITHUB_ENV
          echo "CLBLAST_INC=$(pwd)/../include" >> $GITHUB_ENV

      # 3. Скачиваем свежий llama.cpp и патчи AUR + Хирургия патчей
      - name: Prepare llama.cpp and apply AUR Patches
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          
          # Скачиваем патчи AUR
          wget -q "https://aur.archlinux.org/cgit/aur.git/plain/0001-add-clblast-to-cmake.patch?h=llama.cpp-clblast" -O 0001.patch
          wget -q "https://aur.archlinux.org/cgit/aur.git/plain/0002-add-clblast-header.patch?h=llama.cpp-clblast" -O 0002.patch
          
          # Применяем оригинальные патчи
          patch -p1 < 0001.patch
          patch -p1 < 0002.patch

          # --- ХИРУРГИЯ: Убираем зависимость от автоматического поиска CMake ---
          # 1. Удаляем вызов find_package(CLBlast), чтобы он не затирал наши переменные
          sed -i '/find_package(CLBlast QUIET)/d' ggml/src/ggml-blas/CMakeLists.txt
          
          # 2. Убираем условие "AND CLBlast_FOUND", оставляем только проверку вендора
          sed -i 's/AND CLBlast_FOUND//g' ggml/src/ggml-blas/CMakeLists.txt
          
          # 3. Принудительно прописываем пути к либе и инклудам
          # Мы заменяем "-lclblast" на переменную и добавляем инклуды прямо в цель ggml-blas
          sed -i 's/target_link_libraries(ggml-blas PRIVATE "-lclblast")/target_link_libraries(ggml-blas PRIVATE "${CLBlast_LIBRARY}")/g' ggml/src/ggml-blas/CMakeLists.txt
          sed -i '/target_link_libraries(ggml-blas PRIVATE "${CLBlast_LIBRARY}")/i \    target_include_directories(ggml-blas PRIVATE "${CLBlast_INCLUDE_DIR}")' ggml/src/ggml-blas/CMakeLists.txt
          
          echo "LLAMA_DIR=$(pwd)" >> $GITHUB_ENV

      # 4. Сборка свежего llama.cpp с CLBlast BLAS (Финальный штурм)
      - name: Build llama.cpp
        run: |
          cd $LLAMA_DIR
          mkdir build && cd build
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_BLAS=ON \
            -DGGML_BLAS_VENDOR=CLBlast \
            -DCLBlast_INCLUDE_DIR=${{ env.CLBLAST_INC }} \
            -DCLBlast_LIBRARY=${{ env.CLBLAST_DIR }}/libclblast.so \
            -DOpenCL_INCLUDE_DIR=${{ env.OPENCL_INC_DIR }} \
            -DOpenCL_LIBRARY=${{ env.OPENCL_STUB_LIB }} \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF

          make -j$(nproc) llama-cli llama-bench

      # 5. Упаковка артефактов
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-clblast-aur
          path: |
            ${{ env.LLAMA_DIR }}/build/bin/llama-cli
            ${{ env.LLAMA_DIR }}/build/bin/llama-bench
            ${{ env.LLAMA_DIR }}/build/bin/*.so*
            ${{ env.CLBLAST_DIR }}/libclblast.so*
