name: Termux Build (Vulkan)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: The Trojan Horse (Inject glslc into NDK)
        run: |
          echo "Скачиваем официальный Vulkan SDK..."
          wget -q https://sdk.lunarg.com/sdk/download/1.3.275.0/linux/vulkansdk-linux-x86_64-1.3.275.0.tar.xz
          
          echo "Достаем только компилятор шейдеров glslc..."
          tar -xf vulkansdk-linux-x86_64-1.3.275.0.tar.xz 1.3.275.0/x86_64/bin/glslc
          
          echo "Инжектируем glslc в святая святых - папку с компиляторами Android NDK..."
          NDK_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          cp 1.3.275.0/x86_64/bin/glslc $NDK_BIN/glslc
          chmod +x $NDK_BIN/glslc
          
          echo "Проверка: glslc на месте!"
          $NDK_BIN/glslc --version

      - name: Build llama.cpp for Android
        run: |
          mkdir build && cd build
          
          # Теперь CMake найдет glslc сам, без единого костыля
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_VULKAN_EMBED_SHADERS=ON \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF

          # Собираем на максимальной скорости
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-binaries-vulkan
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
