name: Termux Build (ggml-opencl)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare OpenCL for Android NDK
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git opencl-inc
          
          # Бронебойный grep: ищем любые слова, начинающиеся на "cl" и Заглавную букву
          grep -hoP '\bcl[A-Z][a-zA-Z0-9_]+\b' opencl-inc/CL/*.h | sort -u | awk '{print "void "$1"() {}"}' > opencl_stub.c
          
          NDK_CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          $NDK_CLANG -shared -fPIC -o libOpenCL.so opencl_stub.c
          
          echo "OPENCL_INC_DIR=$(pwd)/opencl-inc" >> $GITHUB_ENV
          echo "OPENCL_STUB_LIB=$(pwd)/libOpenCL.so" >> $GITHUB_ENV

      - name: Patch ggml-opencl (Surgical & Clean)
        run: |
          OCL_FILE=$(find . -name "ggml-opencl.cpp")
          echo "Patching $OCL_FILE"
          
          python3 -c '
          import sys, re
          file_path = sys.argv[1]
          with open(file_path, "r") as f:
              content = f.read()

          # 1. API Downgrade (OpenCL 3.0 -> 1.2/2.0)
          # Заменяем вызов на стандартный clCreateBuffer, удаляя аргумент props
          content = re.sub(r"clCreateBufferWithProperties\s*\(\s*([^,]+)\s*,\s*[^,]+\s*,", r"clCreateBuffer(\1,", content)
          # Убираем деструктор
          content = re.sub(r"clSetContextDestructorCallback\s*\([^;]+\);", r"(void)0;", content)

          # 2. Маскировка под Intel (Ваша идея)
          content = content.replace("strstr(dev_ctx->device_name.c_str(), \"Intel\")", "(strstr(dev_ctx->device_name.c_str(), \"Intel\") || strstr(dev_ctx->device_name.c_str(), \"Mali\"))")

          # 3. Kernel Survival Kit (Эмуляция субгрупп для Mali)
          # Эти макросы закроют все ошибки "undeclared identifier", которые выдавал драйвер Mali
          survival_kit = (
              "\\n"
              "#define get_sub_group_id() 0\\n"
              "#define get_sub_group_local_id() 0\\n"
              "#define sub_group_reduce_add(x) (x)\\n"
              "#define sub_group_any(x) (x)\\n"
              "#define sub_group_all(x) (x)\\n"
              "#define N_SIMDGROUP 1\\n"
              "#define N_SIMDWIDTH 32\\n"
              "#define N_DST 4\\n"
              "// Прагма отключена патчем: \\n"
          )
          
          content = content.replace("#pragma OPENCL EXTENSION cl_khr_subgroups : enable", survival_kit)

          with open(file_path, "w") as f:
              f.write(content)
          ' "$OCL_FILE"

      - name: Build llama.cpp with ggml-opencl
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENCL=ON \
            -DGGML_OPENCL_USE_ADRENO_KERNELS=OFF \
            -DOpenCL_INCLUDE_DIR=$OPENCL_INC_DIR \
            -DOpenCL_LIBRARY=$OPENCL_STUB_LIB \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-opencl-final
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
            build/bin/*.so*
