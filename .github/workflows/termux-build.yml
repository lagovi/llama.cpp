name: Termux Build (Vulkan)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: The Trojan Horse (glslc & vulkan.hpp)
        run: |
          echo "Скачиваем официальный Vulkan SDK..."
          wget -q https://sdk.lunarg.com/sdk/download/1.3.283.0/linux/vulkansdk-linux-x86_64-1.3.283.0.tar.xz
          tar xf vulkansdk-linux-x86_64-1.3.283.0.tar.xz
          VULKAN_SDK="$(pwd)/1.3.283.0/x86_64"
          
          echo "Инжектируем glslc в NDK..."
          NDK_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          cp $VULKAN_SDK/bin/glslc $NDK_BIN/glslc
          chmod +x $NDK_BIN/glslc
          
          echo "Инжектируем C++ заголовки Vulkan (vulkan.hpp) в ядро NDK..."
          NDK_SYSROOT=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/vulkan
          # Копируем всё содержимое папки include/vulkan из SDK в sysroot NDK
          cp -r $VULKAN_SDK/include/vulkan/* $NDK_SYSROOT/
          
          # Экспортируем путь на всякий случай
          echo "VULKAN_SDK=$VULKAN_SDK" >> $GITHUB_ENV

      - name: Build llama.cpp for Android
        run: |
          mkdir build && cd build
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_OPENCL=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_VULKAN_EMBED_SHADERS=ON \
            -DVulkan_GLSLC_EXECUTABLE=$GLSLC_ABS_PATH \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF

          make -j$(nproc) llama-cli llama-bench libggml-vulkan.so libllama.so libggml.so libggml-base.so libggml-cpu.so

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-binaries-vulkan
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
            build/bin/*.so*
