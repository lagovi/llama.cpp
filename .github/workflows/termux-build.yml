name: Termux Build (Vulkan)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and Setup glslc
        run: |
          echo "Скачиваем официальный Vulkan SDK (только для инструмента glslc)..."
          wget -q https://sdk.lunarg.com/sdk/download/1.3.283.0/linux/vulkansdk-linux-x86_64-1.3.283.0.tar.xz
          tar xf vulkansdk-linux-x86_64-1.3.283.0.tar.xz
          
          # Получаем железобетонный абсолютный путь к файлу
          GLSLC_ABS_PATH="$(pwd)/1.3.283.0/x86_64/bin/glslc"
          chmod +x "$GLSLC_ABS_PATH"
          
          echo "glslc находится здесь: $GLSLC_ABS_PATH"
          echo "GLSLC_ABS_PATH=$GLSLC_ABS_PATH" >> $GITHUB_ENV

      - name: Build llama.cpp for Android
        run: |
          mkdir build && cd build
          
          # Передаем абсолютный путь напрямую в CMake, обходя любые внутренние поиски
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_VULKAN_EMBED_SHADERS=ON \
            -DVulkan_GLSLC_EXECUTABLE=$GLSLC_ABS_PATH \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF

          # Используем все ресурсы сервера
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-binaries-vulkan
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
