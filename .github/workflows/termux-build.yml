name: Termux Build (Vulkan)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Vulkan SDK and PATH
        run: |
          echo "Скачиваем официальный Vulkan SDK..."
          wget -q https://sdk.lunarg.com/sdk/download/1.3.283.0/linux/vulkansdk-linux-x86_64-1.3.283.0.tar.xz
          tar xf vulkansdk-linux-x86_64-1.3.283.0.tar.xz
          
          # УБРАЛИ /x86_64 в конце пути
          VULKAN_SDK="$(pwd)/1.3.283.0"
          
          # 1. Добавляем путь в окружение GitHub для будущих шагов
          echo "VULKAN_SDK=$VULKAN_SDK" >> $GITHUB_ENV
          
          # 2. Добавляем папку bin в системный PATH (ЭТО ПОЧИНИТ ВНУТРЕННИЙ ПРОЕКТ)
          echo "$VULKAN_SDK/bin" >> $GITHUB_PATH

      - name: Build llama.cpp for Android
        run: |
          mkdir build && cd build
          
          # 3. Передаем абсолютный путь напрямую (ЭТО ПОЧИНИТ ВНЕШНИЙ ПРОЕКТ NDK)
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_VULKAN_EMBED_SHADERS=ON \
            -DVulkan_GLSLC_EXECUTABLE=$VULKAN_SDK/bin/glslc \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF

          # Используем всю мощь процессоров GitHub
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-binaries-vulkan
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
