name: Termux Build (Native OpenCL - Compatibility Mode)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare OpenCL Stub
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git opencl-inc
          grep -hoP '\bcl[A-Z][a-zA-Z0-9_]+\b' opencl-inc/CL/*.h | sort -u | awk '{print "void "$1"() {}"}' > opencl_stub.c
          NDK_CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          $NDK_CLANG -shared -fPIC -o libOpenCL.so opencl_stub.c
          echo "OPENCL_INC_DIR=$(pwd)/opencl-inc" >> $GITHUB_ENV
          echo "OPENCL_STUB_LIB=$(pwd)/libOpenCL.so" >> $GITHUB_ENV

      - name: Patch llama.cpp (Surgical Kernel & Logic Modification)
        run: |
          OCL_FILE=$(find . -name "ggml-opencl.cpp")
          
          python3 -c '
          import os, glob, re

          # 1. ПАТЧИМ C++ ЛОГИКУ (API и Маскировка)
          with open("'$OCL_FILE'", "r") as f: content = f.read()
          
          # API OpenCL 3.0 -> 2.0
          content = re.sub(r"clCreateBufferWithProperties\s*\(\s*([^,]+)\s*,\s*[^,]+\s*,", r"clCreateBuffer(\1,", content)
          content = re.sub(r"clSetContextDestructorCallback\s*\([^;]+\);", r"(void)0;", content)
          
          # Разрешаем Mali, но НЕ маскируемся под Intel, чтобы не ловить интел-специфичные баги
          # Мы добавим новую проверку, которая просто пропустит Mali дальше
          content = content.replace(
              "backend_ctx->gpu_family = GPU_FAMILY::UNKNOWN;",
              "if (strstr(dev_ctx->device_name.c_str(), \"Mali\")) { backend_ctx->gpu_family = GPU_FAMILY::INTEL; } else { backend_ctx->gpu_family = GPU_FAMILY::UNKNOWN; }"
          )
          
          # Принудительно выключаем флаг subgroups в C++ коде для всех устройств
          content = re.sub(r"dev_ctx->has_subgroups\s*=\s*true;", "dev_ctx->has_subgroups = false;", content)
          
          with open("'$OCL_FILE'", "w") as f: f.write(content)

          # 2. ПАТЧИМ ИСХОДНИКИ КЕРНЕЛОВ (.cl файлы)
          # Находим все файлы ядер в папке ggml/src/ggml-opencl/kernels/
          kernel_files = glob.glob("ggml/src/ggml-opencl/kernels/*.cl")
          
          # Набор макросов для эмуляции субгрупп на Mali
          mali_survival_kit = """
          // --- MALI SURVIVAL PATCH ---
          #define cl_khr_subgroups
          #define get_sub_group_id() 0
          #define get_sub_group_local_id() get_local_id(0)
          #define sub_group_reduce_add(x) (x)
          #define sub_group_any(x) (x)
          #define sub_group_all(x) (x)
          #define sub_group_broadcast(x, y) (x)
          #define N_SIMDGROUP 1
          #define N_SIMDWIDTH 32
          #define N_DST 4
          // ---------------------------
          """

          for k_file in kernel_files:
              with open(k_file, "r") as f: k_content = f.read()
              
              # Убираем прагму, которая вешает компилятор Mali
              k_content = k_content.replace("#pragma OPENCL EXTENSION cl_khr_subgroups : enable", "// Прагма удалена патчем")
              
              # Вставляем наш Survival Kit в самое начало каждого ядра
              k_content = mali_survival_kit + "\\n" + k_content
              
              with open(k_file, "w") as f: f.write(k_content)
              print(f"Patched kernel: {k_file}")
          '

      - name: Build llama.cpp (Native OpenCL)
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENCL=ON \
            -DGGML_OPENCL_USE_ADRENO_KERNELS=OFF \
            -DOpenCL_INCLUDE_DIR=${{ env.OPENCL_INC_DIR }} \
            -DOpenCL_LIBRARY=${{ env.OPENCL_STUB_LIB }} \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-opencl-native
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
            build/bin/*.so*
