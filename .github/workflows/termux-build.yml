name: Termux Build (CLBlast-BLAS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4

      - name: Prepare OpenCL for Android NDK
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git opencl-inc
          # Железобетонная пустышка
          grep -hoP '\bcl[A-Z][a-zA-Z0-9_]+\b' opencl-inc/CL/*.h | sort -u | awk '{print "void "$1"() {}"}' > opencl_stub.c
          NDK_CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          $NDK_CLANG -shared -fPIC -o libOpenCL.so opencl_stub.c
          echo "OPENCL_INC_DIR=$(pwd)/opencl-inc" >> $GITHUB_ENV
          echo "OPENCL_STUB_LIB=$(pwd)/libOpenCL.so" >> $GITHUB_ENV

      - name: Build CLBlast for Android (with NETLIB)
        run: |
          git clone --depth 1 https://github.com/CNugteren/CLBlast.git
          cd CLBlast && mkdir build && cd build
          
          # Собираем и сразу делаем локальный install, чтобы llama.cpp легко нашел все нужные заголовки
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/../install \
            -DNETLIB=ON \
            -DOPENCL_INCLUDE_DIRS=$OPENCL_INC_DIR \
            -DOPENCL_LIBRARIES=$OPENCL_STUB_LIB
          make -j$(nproc) install
          
          echo "CLBLAST_INSTALL_DIR=$(pwd)/../install" >> $GITHUB_ENV

      - name: Apply AUR CLBlast Patches to llama.cpp
        run: |
          # Скачиваем официальные патчи из репозитория AUR
          wget "https://aur.archlinux.org/cgit/aur.git/plain/0001-add-clblast-to-cmake.patch?h=llama.cpp-clblast" -O patch1.patch
          wget "https://aur.archlinux.org/cgit/aur.git/plain/0002-add-clblast-header.patch?h=llama.cpp-clblast" -O patch2.patch
          
          # Хак 1: Убираем жесткую проверку CLBlast_FOUND, так как кросс-компиляция может её провалить
          sed -i 's/AND CLBlast_FOUND//g' patch1.patch
          # Хак 2: Заменяем -lclblast на абсолютный путь к собранной библиотеке, чтобы линковщик не заблудился
          sed -i "s|\"-lclblast\"|\"$CLBLAST_INSTALL_DIR/lib/libclblast.so\"|g" patch1.patch
          
          # Применяем патчи к исходникам
          patch -p1 < patch1.patch
          patch -p1 < patch2.patch

      - name: Build llama.cpp with CLBlast-BLAS
        run: |
          mkdir build && cd build
          
          # Обратите внимание: мы передаем путь к clblast_netlib_c.h через CMAKE_CXX_FLAGS
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-I$CLBLAST_INSTALL_DIR/include" \
            -DGGML_BLAS=ON \
            -DGGML_BLAS_VENDOR=CLBlast \
            -DOpenCL_INCLUDE_DIR=$OPENCL_INC_DIR \
            -DOpenCL_LIBRARY=$OPENCL_STUB_LIB \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF
            
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-blas-final
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
            build/bin/*.so*
            CLBlast/install/lib/libclblast.so*
