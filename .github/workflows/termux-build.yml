name: Termux Build (Vulkan)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Vulkan Tools
        run: |
          # Скачиваем только glslc для сборки шейдеров на хосте
          wget -q https://sdk.lunarg.com/sdk/download/1.3.283.0/linux/vulkansdk-linux-x86_64-1.3.283.0.tar.xz
          tar xf vulkansdk-linux-x86_64-1.3.283.0.tar.xz
          echo "GLSLC_PATH=$(pwd)/1.3.283.0/x86_64/bin/glslc" >> $GITHUB_ENV

      - name: Build llama.cpp for Android
        run: |
          mkdir build && cd build
          
          # Отключаем OpenCL (-DGGML_OPENCL=OFF), чтобы избежать ошибок поиска библиотек
          # Отключаем OpenMP (-DGGML_OPENMP=OFF), чтобы убрать зависимость от libomp.so
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_OPENCL=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_VULKAN_EMBED_SHADERS=ON \
            -DVulkan_GLSLC_EXECUTABLE=$GLSLC_PATH \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=BOTH \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF

          # Сборка
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-vulkan-only
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
            build/bin/*.so*
