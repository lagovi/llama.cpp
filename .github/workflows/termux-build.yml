name: Termux Build (ggml-opencl)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare OpenCL for Android NDK
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git opencl-inc
          
          # Бронебойный grep: ищем любые слова, начинающиеся на "cl" и Заглавную букву
          grep -hoP '\bcl[A-Z][a-zA-Z0-9_]+\b' opencl-inc/CL/*.h | sort -u | awk '{print "void "$1"() {}"}' > opencl_stub.c
          
          NDK_CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          $NDK_CLANG -shared -fPIC -o libOpenCL.so opencl_stub.c
          
          echo "OPENCL_INC_DIR=$(pwd)/opencl-inc" >> $GITHUB_ENV
          echo "OPENCL_STUB_LIB=$(pwd)/libOpenCL.so" >> $GITHUB_ENV

      - name: Patch ggml-opencl (Safe Header Injection)
        run: |
          OCL_FILE=$(find . -name "ggml-opencl.cpp")
          echo "Patching $OCL_FILE"
          
          python3 -c '
          import sys
          file_path = sys.argv[1]
          with open(file_path, "r") as f:
              lines = f.readlines()
          
          # 1. Находим последний #include, чтобы вставить макросы ПОСЛЕ него
          last_inc = 0
          for i, line in enumerate(lines):
              if line.strip().startswith("#include"):
                  last_inc = i
          
          # Вставляем наши определения сразу после инклудов
          lines.insert(last_inc + 1, "\n// --- MALI EMULATION PATCH ---\n")
          lines.insert(last_inc + 2, "#define clCreateBuffer_Emulated(ctx, props, flags, size, ptr, err) ((void)(props), clCreateBuffer(ctx, flags, size, ptr, err))\n")
          lines.insert(last_inc + 3, "#define clSetContextDestructorCallback(ctx, cb, data) CL_SUCCESS\n")
          lines.insert(last_inc + 4, "// ---------------------------\n\n")
          
          content = "".join(lines)

          # 2. Подменяем вызовы в коде на наши эмулированные версии
          content = content.replace("clCreateBufferWithProperties", "clCreateBuffer_Emulated")

          # 3. Маскировка Mali под Intel
          content = content.replace("strstr(dev_ctx->device_name.c_str(), \"Intel\")", 
                                    "(strstr(dev_ctx->device_name.c_str(), \"Intel\") || strstr(dev_ctx->device_name.c_str(), \"Mali\"))")

          # 4. Вставка макросов эмуляции субгрупп для КЕРНЕЛОВ (в параметры строки компиляции)
          mali_macros = (" -Dcl_khr_subgroups -Dget_sub_group_id()=0 -Dget_sub_group_local_id()=0 "
                         "-Dsub_group_reduce_add(x)=(x) -Dsub_group_any(x)=(x) -Dsub_group_all(x)=(x) "
                         "-DN_SIMDGROUP=1 -DN_SIMDWIDTH=1 -DN_DST=1 ")
          
          content = content.replace("-cl-std=CL2.0", "-cl-std=CL2.0 " + mali_macros)

          # 5. Отключаем прагму в строковых литералах кернелов
          content = content.replace("#pragma OPENCL EXTENSION cl_khr_subgroups : enable", 
                                    "// #pragma OPENCL EXTENSION cl_khr_subgroups : disabled")

          with open(file_path, "w") as f:
              f.write(content)
          ' "$OCL_FILE"

      - name: Build llama.cpp with ggml-opencl
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENCL=ON \
            -DGGML_OPENCL_USE_ADRENO_KERNELS=OFF \
            -DOpenCL_INCLUDE_DIR=$OPENCL_INC_DIR \
            -DOpenCL_LIBRARY=$OPENCL_STUB_LIB \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-opencl-final
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
            build/bin/*.so*
