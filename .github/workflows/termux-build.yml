name: Termux Build (ggml-opencl)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare OpenCL for Android NDK
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git opencl-inc
          
          # Бронебойный grep: ищем любые слова, начинающиеся на "cl" и Заглавную букву
          grep -hoP '\bcl[A-Z][a-zA-Z0-9_]+\b' opencl-inc/CL/*.h | sort -u | awk '{print "void "$1"() {}"}' > opencl_stub.c
          
          NDK_CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          $NDK_CLANG -shared -fPIC -o libOpenCL.so opencl_stub.c
          
          echo "OPENCL_INC_DIR=$(pwd)/opencl-inc" >> $GITHUB_ENV
          echo "OPENCL_STUB_LIB=$(pwd)/libOpenCL.so" >> $GITHUB_ENV

      - name: Patch ggml-opencl and Kernels (Source Surgery)
        run: |
          python3 -c '
          import glob, re

          # 1. Патчим бэкенд C++ (API и маскировка под Intel)
          cpp_files = glob.glob("ggml/src/ggml-opencl.cpp") + glob.glob("ggml/src/ggml-opencl/**/*.cpp", recursive=True)
          for f in cpp_files:
              with open(f, "r") as file: content = file.read()
              
              content = re.sub(r"clCreateBufferWithProperties\s*\(\s*([^,]+)\s*,\s*[^,]+\s*,", r"clCreateBuffer(\1,", content)
              content = re.sub(r"clSetContextDestructorCallback\s*\([^;]+\);", r"(void)0;", content)
              content = content.replace("strstr(dev_ctx->device_name.c_str(), \"Intel\")", "(strstr(dev_ctx->device_name.c_str(), \"Intel\") || strstr(dev_ctx->device_name.c_str(), \"Mali\"))")
              
              with open(f, "w") as file: file.write(content)
              print(f"Patched C++: {f}")

          # 2. Патчим ВСЕ исходники кернелов (.cl файлы)
          cl_files = glob.glob("ggml/src/ggml-opencl/**/*.cl", recursive=True)
          
          # Наш набор для выживания на Mali
          macros = """
          // --- MALI SURVIVAL KIT ---
          #define get_sub_group_id() (get_local_id(0) / 32)
          #define get_sub_group_local_id() (get_local_id(0) % 32)
          #define sub_group_reduce_add(x) (x)
          #define sub_group_any(x) (x)
          #define sub_group_all(x) (x)
          #ifndef N_SIMDGROUP
          #define N_SIMDGROUP 1
          #endif
          #ifndef N_SIMDWIDTH
          #define N_SIMDWIDTH 32
          #endif
          #ifndef N_DST
          #define N_DST 4
          #endif
          // -------------------------
          """
          
          for f in cl_files:
              with open(f, "r") as file: content = file.read()
              
              # Удаляем проблемную прагму
              content = re.sub(r"#pragma OPENCL EXTENSION cl_khr_subgroups[^\n]*\n", "", content)
              
              # Вставляем макросы в начало файла (сразу после оставшихся прагм)
              lines = content.split("\n")
              insert_idx = 0
              for i, line in enumerate(lines):
                  if line.strip().startswith("#pragma"):
                      insert_idx = i + 1
              lines.insert(insert_idx, macros)
              
              with open(f, "w") as file: file.write("\n".join(lines))
              print(f"Patched CL Kernel: {f}")
          '

      - name: Build llama.cpp with ggml-opencl
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENCL=ON \
            -DGGML_OPENCL_USE_ADRENO_KERNELS=OFF \
            -DOpenCL_INCLUDE_DIR=$OPENCL_INC_DIR \
            -DOpenCL_LIBRARY=$OPENCL_STUB_LIB \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-opencl-final
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
            build/bin/*.so*
