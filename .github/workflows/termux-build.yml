name: Termux Build (Vulkan & OpenCL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Full Build Process
        run: |
          # 1. Установка системных заголовков для OpenCL
          sudo apt-get update
          sudo apt-get install -y opencl-headers ocl-icd-opencl-dev

          # 2. Скачивание Vulkan SDK (для получения glslc)
          wget -q https://sdk.lunarg.com/sdk/download/1.3.283.0/linux/vulkansdk-linux-x86_64-1.3.283.0.tar.xz
          tar xf vulkansdk-linux-x86_64-1.3.283.0.tar.xz
          GLSLC_PATH=$(pwd)/1.3.283.0/x86_64/bin/glslc
          chmod +x $GLSLC_PATH
          
          echo "Используем glslc по пути: $GLSLC_PATH"

          # 3. Сборка проекта
          mkdir build && cd build
          
          # -DGGML_OPENMP=OFF уберет зависимость от libomp.so
          # -DVulkan_GLSLC_EXECUTABLE передает прямой путь к компилятору шейдеров
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_OPENCL=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_VULKAN_EMBED_SHADERS=ON \
            -DVulkan_GLSLC_EXECUTABLE=$GLSLC_PATH \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=BOTH \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF

          # Сборка всех компонентов
          make -j$(nproc)

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-binaries-final
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
            build/bin/*.so*
