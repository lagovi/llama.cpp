- name: Patch ggml-opencl for Mali Survival Mode
        run: |
          OCL_FILE=$(find . -name "ggml-opencl.cpp")
          echo "Patching $OCL_FILE"
          
          python3 -c '
          import sys
          file_path = sys.argv[1]
          with open(file_path, "r") as f:
              lines = f.readlines()
          
          # 1. Даунгрейд OpenCL 3.0 -> 2.0 (clCreateBufferWithProperties)
          for i, line in enumerate(lines):
              if "clCreateBufferWithProperties" in line and "#define" not in line:
                  lines.insert(i, "#define clCreateBufferWithProperties(ctx, props, flags, size, ptr, err) ((void)(props), clCreateBuffer(ctx, flags, size, ptr, err))\n")
                  break
          for i, line in enumerate(lines):
              if "clSetContextDestructorCallback" in line and "#define" not in line:
                  lines.insert(i, "#define clSetContextDestructorCallback(ctx, cb, data) CL_SUCCESS\n")
                  break
                  
          # 2. Маскировка Mali под Intel
          for i, line in enumerate(lines):
              if "strstr(dev_ctx->device_name.c_str(), \"Intel\")" in line:
                  lines[i] = line.replace("\"Intel\"", "\"Intel\") || strstr(dev_ctx->device_name.c_str(), \"Mali\"")
          
          # 3. Эмуляция субгрупп для Mali (Survival Mode)
          # Внедряем макросы прямо в строку определений кернела
          for i, line in enumerate(lines):
              if "dev_ctx->kernel_definitions +=" in line and "cl-std=CL2.0" in line:
                  # Вставляем заглушки для функций, которых нет в Mali OpenCL 2.0
                  patch = (
                      "dev_ctx->kernel_definitions += \" -Dcl_khr_subgroups -Dget_sub_group_id()=0 -Dget_sub_group_local_id()=0 \";\n"
                      "            dev_ctx->kernel_definitions += \" -Dsub_group_reduce_add(x)=(x) -DN_SIMDGROUP=1 -DN_SIMDWIDTH=2 -DN_DST=1 \";\n"
                  )
                  lines.insert(i + 1, patch)
                  print("✅ Patched: Subgroup emulation injected!")
                  break
          
          with open(file_path, "w") as f:
              f.writelines(lines)
          ' "$OCL_FILE"
