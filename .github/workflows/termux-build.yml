name: Termux Build (Vulkan & OpenCL)

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Android NDK
        uses: nndung179/setup-ndk@v1
        with:
          ndk-version: r27b # Актуальная версия для современных Clang

      - name: Build llama.cpp for Termux
        run: |
          # Создаем папку для сборки
          mkdir build && cd build
          
          # Настраиваем CMake для кросс-компиляции под Android (aarch64)
          # Мы включаем и Vulkan, и OpenCL сразу. 
          # GitHub легко это "переварит".
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_VULKAN=ON \
            -DGGML_OPENCL=ON \
            -DGGML_VULKAN_EMBED_SHADERS=ON \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TESTS=OFF

          # Собираем в 4 потока (на GitHub это безопасно)
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-binaries-termux
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
