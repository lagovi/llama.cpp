name: Termux Build (ggml-opencl)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare OpenCL for Android NDK
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers.git opencl-inc
          
          # Бронебойный grep: ищем любые слова, начинающиеся на "cl" и Заглавную букву
          grep -hoP '\bcl[A-Z][a-zA-Z0-9_]+\b' opencl-inc/CL/*.h | sort -u | awk '{print "void "$1"() {}"}' > opencl_stub.c
          
          NDK_CLANG=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          $NDK_CLANG -shared -fPIC -o libOpenCL.so opencl_stub.c
          
          echo "OPENCL_INC_DIR=$(pwd)/opencl-inc" >> $GITHUB_ENV
          echo "OPENCL_STUB_LIB=$(pwd)/libOpenCL.so" >> $GITHUB_ENV

      - name: Patch ggml-opencl (Surgical Source Modification)
        run: |
          OCL_FILE=$(find . -name "ggml-opencl.cpp")
          echo "Patching $OCL_FILE"
          
          python3 -c '
          import sys, re
          file_path = sys.argv[1]
          with open(file_path, "r") as f:
              content = f.read()

          # 1. Удаляем вызов clCreateBufferWithProperties (OpenCL 3.0) 
          # Заменяем на clCreateBuffer (OpenCL 1.0+), удаляя 2-й аргумент (props)
          # Было: clCreateBufferWithProperties(ctx, props, flags, size, ptr, err)
          # Стало: clCreateBuffer(ctx, flags, size, ptr, err)
          content = re.sub(
              r"clCreateBufferWithProperties\s*\(\s*([^,]+)\s*,\s*[^,]+\s*,", 
              r"clCreateBuffer(\1,", 
              content
          )

          # 2. Удаляем вызов clSetContextDestructorCallback (OpenCL 3.0)
          # Заменяем всю строку на безопасный (void)0
          content = re.sub(
              r"clSetContextDestructorCallback\s*\([^;]+\);", 
              r"(void)0;", 
              content
          )

          # 3. Маскировка под Intel (Ваша идея)
          # Добавляем проверку на Mali в блок определения семейства GPU
          content = content.replace(
              "strstr(dev_ctx->device_name.c_str(), \"Intel\")", 
              "(strstr(dev_ctx->device_name.c_str(), \"Intel\") || strstr(dev_ctx->device_name.c_str(), \"Mali\"))"
          )

          # 4. Эмуляция субгрупп для компилятора кернелов (OpenCL C)
          # Внедряем макросы прямо в строку параметров компиляции
          mali_macros = (
              " -Dcl_khr_subgroups -Dget_sub_group_id()=0 -Dget_sub_group_local_id()=0 "
              "-Dsub_group_reduce_add(x)=(x) -Dsub_group_any(x)=(x) -Dsub_group_all(x)=(x) "
              "-DN_SIMDGROUP=1 -DN_SIMDWIDTH=1 -DN_DST=1 "
          )
          content = content.replace("-cl-std=CL2.0", "-cl-std=CL2.0 " + mali_macros)

          # 5. Нейтрализация прагмы расширения внутри кода кернелов
          content = content.replace("cl_khr_subgroups", "cl_khr_subgroups_DISABLED")

          with open(file_path, "w") as f:
              f.write(content)
          ' "$OCL_FILE"

      - name: Build llama.cpp with ggml-opencl
        run: |
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENCL=ON \
            -DGGML_OPENCL_USE_ADRENO_KERNELS=OFF \
            -DOpenCL_INCLUDE_DIR=$OPENCL_INC_DIR \
            -DOpenCL_LIBRARY=$OPENCL_STUB_LIB \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TESTS=OFF
          make -j$(nproc) llama-cli llama-bench

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llama-opencl-final
          path: |
            build/bin/llama-cli
            build/bin/llama-bench
            build/bin/*.so*
